<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NovaForge Editor</title>
    <style>
      :root {
        color-scheme: dark;
        --tree-width: 240px;
        --inspector-width: 300px;
        --bottom-height: 180px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0b10;
        color: #e8e8f0;
        font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
      }

      /*
       * Every track size below reads from a CSS custom property that `Splitter` (from
       * @novaforge/editor) writes to directly — no grid-template string parsing anywhere, in
       * either direction. Dragging a handle just changes the variable's pixel value.
       */
      #app {
        display: grid;
        grid-template-columns: var(--tree-width) 6px 1fr 6px var(--inspector-width);
        grid-template-rows: auto 1fr 6px var(--bottom-height);
        grid-template-areas:
          'toolbar  toolbar  toolbar   toolbar  toolbar'
          'tree     tree-h   viewport  insp-h   inspector'
          'tree     tree-h   split-v   insp-h   inspector'
          'tree     tree-h   bottom    insp-h   inspector';
        height: 100%;
      }

      #toolbar {
        grid-area: toolbar;
        display: flex;
        align-items: center;
        gap: 0.5em;
        padding: 0.5em 0.75em;
        border-bottom: 1px solid #26263a;
        background: #16161f;
        flex-wrap: wrap;
      }

      #toolbar h1 {
        font-size: 0.95em;
        font-weight: 600;
        margin: 0 0.75em 0 0;
        color: #9d8df1;
      }

      #toolbar .spacer {
        flex: 1;
      }

      #toolbar .group {
        display: flex;
        gap: 0.25em;
        padding: 0 0.5em;
        border-right: 1px solid #26263a;
      }

      #toolbar .group:last-of-type {
        border-right: none;
      }

      #toolbar label.inline {
        display: flex;
        align-items: center;
        gap: 0.3em;
        color: #a0a0b8;
      }

      #scene-tree {
        grid-area: tree;
        overflow-y: auto;
        border-right: 1px solid #26263a;
        min-width: 120px;
      }

      .splitter {
        background: #1c1c29;
        position: relative;
      }

      .splitter:hover,
      .splitter:active {
        background: #33334a;
      }

      .splitter--horizontal {
        cursor: col-resize;
      }

      .splitter--vertical {
        cursor: row-resize;
      }

      #splitter-tree {
        grid-area: tree-h;
      }

      #splitter-inspector {
        grid-area: insp-h;
      }

      #splitter-bottom {
        grid-area: split-v;
      }

      #viewport {
        grid-area: viewport;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #050508;
        overflow: auto;
      }

      #viewport canvas {
        display: block;
      }

      #game-canvas {
        position: relative;
      }

      #game-webgl {
        position: absolute;
        inset: 0;
      }

      #overlay {
        position: absolute;
        inset: 0;
        pointer-events: auto;
      }

      #inspector {
        grid-area: inspector;
        overflow-y: auto;
        border-left: 1px solid #26263a;
        min-width: 160px;
      }

      #bottom-panel {
        grid-area: bottom;
        display: flex;
        flex-direction: column;
        border-top: 1px solid #26263a;
        min-height: 80px;
        overflow: hidden;
      }

      #bottom-tabs {
        display: flex;
        gap: 2px;
        padding: 0.3em 0.3em 0;
        background: #16161f;
        flex-shrink: 0;
      }

      .tab-button {
        padding: 0.3em 0.8em;
        border: 1px solid #26263a;
        border-bottom: none;
        border-radius: 4px 4px 0 0;
        background: #1c1c29;
        color: #a0a0b8;
        font: inherit;
        cursor: pointer;
      }

      .tab-button[data-active='true'] {
        background: #16161f;
        color: #4cc9f0;
      }

      #bottom-content {
        flex: 1;
        overflow: hidden;
        position: relative;
      }

      #bottom-content > div {
        position: absolute;
        inset: 0;
        overflow-y: auto;
      }

      #bottom-content > div[hidden] {
        display: none;
      }

      .toolbar-button {
        padding: 0.35em 0.8em;
        border: 1px solid #33334a;
        border-radius: 4px;
        background: #22222f;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }

      .toolbar-button:hover {
        background: #2c2c3d;
      }

      .toolbar-button[data-active='true'] {
        border-color: #4cc9f0;
        color: #4cc9f0;
      }

      #load-input {
        display: none;
      }

      .stats-readout {
        color: #6a6a80;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.85em;
        padding-left: 0.4em;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="toolbar">
        <h1>NovaForge Editor</h1>

        <div class="group">
          <button class="toolbar-button" id="btn-play" title="Space">▶ Play</button>
          <button class="toolbar-button" id="btn-stop" data-active="true" title="Space">⏸ Stop</button>
          <button class="toolbar-button" id="btn-step" title=".">⏭ Step</button>
        </div>

        <div class="group">
          <button class="toolbar-button" id="btn-undo" title="Ctrl+Z">↶ Undo</button>
          <button class="toolbar-button" id="btn-redo" title="Ctrl+Y">↷ Redo</button>
        </div>

        <div class="group">
          <button class="toolbar-button" id="gizmo-translate" data-active="true" title="1">⊹ Move</button>
          <button class="toolbar-button" id="gizmo-rotate" title="2">↻ Rotate</button>
          <button class="toolbar-button" id="gizmo-scale" title="3">⤢ Scale</button>
        </div>

        <div class="group">
          <label class="inline"><input type="checkbox" id="snap-position" /> Snap</label>
          <input type="number" id="snap-grid-size" value="16" min="0" step="1" style="width: 4em" />
          <label class="inline"><input type="checkbox" id="snap-rotation" /> Angle</label>
          <input type="number" id="snap-angle-size" value="15" min="0" step="1" style="width: 4em" />
        </div>

        <div class="group">
          <button class="toolbar-button" id="btn-backend-canvas2d" data-active="true">Canvas2D</button>
          <button class="toolbar-button" id="btn-backend-webgl2">WebGL2</button>
          <span id="renderer-stats" class="stats-readout"></span>
        </div>

        <span class="spacer"></span>

        <div class="group">
          <button class="toolbar-button" id="btn-save">Save Scene</button>
          <button class="toolbar-button" id="btn-load">Load Scene</button>
          <input type="file" id="load-input" accept="application/json" />
        </div>
      </div>

      <div id="scene-tree"></div>
      <div class="splitter splitter--horizontal" id="splitter-tree"></div>

      <div id="viewport">
        <div id="game-canvas">
          <canvas id="game" width="640" height="480"></canvas>
          <canvas id="game-webgl" width="640" height="480" style="display: none"></canvas>
          <canvas id="overlay" width="640" height="480"></canvas>
        </div>
      </div>

      <div class="splitter splitter--vertical" id="splitter-bottom"></div>
      <div id="bottom-panel">
        <div id="bottom-tabs">
          <button class="tab-button" id="tab-assets" data-active="true">Assets</button>
          <button class="tab-button" id="tab-timeline">Timeline</button>
        </div>
        <div id="bottom-content">
          <div id="asset-panel"></div>
          <div id="timeline-panel" hidden></div>
        </div>
      </div>

      <div class="splitter splitter--horizontal" id="splitter-inspector"></div>
      <div id="inspector"></div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
