<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NovaForge — Asteroids</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #05050a;
        --fg: #e8e8f0;
        --muted: #8a8aa0;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 1.5rem;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
      }

      h1 {
        margin: 0;
        font-size: 1.1rem;
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      h1 small {
        color: var(--muted);
        font-weight: 400;
      }

      canvas {
        display: block;
        max-width: 100%;
        border-radius: 6px;
        box-shadow: 0 12px 40px rgb(0 0 0 / 0.5);
        touch-action: none;
      }

      .hints {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem 1.25rem;
        justify-content: center;
        color: var(--muted);
      }

      kbd {
        padding: 0.1em 0.4em;
        border: 1px solid #33334a;
        border-bottom-width: 2px;
        border-radius: 4px;
        background: #1a1a26;
        color: var(--fg);
        font: inherit;
        font-size: 0.85em;
      }

      #debug {
        min-width: 320px;
        max-width: 100%;
        overflow-x: auto;
        margin: 0;
        padding: 0.75rem 1rem;
        border-radius: 6px;
        background: #12121a;
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <h1>NovaForge <small>— Asteroids</small></h1>

    <canvas id="game" width="800" height="600"></canvas>

    <div class="hints">
      <span><kbd>&larr;</kbd> <kbd>&rarr;</kbd> or <kbd>A</kbd> <kbd>D</kbd> to turn</span>
      <span><kbd>&uarr;</kbd> or <kbd>W</kbd> to thrust</span>
      <span><kbd>Space</kbd> to fire</span>
      <span><kbd>Esc</kbd> to pause</span>
      <span><kbd>F3</kbd> for stats</span>
    </div>

    <pre id="debug" hidden></pre>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
